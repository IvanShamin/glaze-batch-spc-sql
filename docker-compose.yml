# Local PostgreSQL 16 for running the SQL scripts. The project folder is mounted at /project,
# so psql (running inside the container) can read data/*.csv and write output/*.csv.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: glaze
    volumes:
      - ./:/project
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d glaze"]
      interval: 3s
      timeout: 3s
      retries: 15
